<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ntune</title>
    <script>
      // Theme applied BEFORE React renders, so a launch never flashes the
      // default theme first. Monochrome is the default: no stored choice, an
      // unrecognised one, or no localStorage at all (private mode) => mono.
      // The one source of truth for this rule is loadTheme() in App.tsx; keep
      // them in step. Mirrors nplay.
      try {
        var t = localStorage.getItem("ntune.theme");
        if (t !== "fizx" && t !== "upleb") t = "mono";
        if (t === "upleb") document.documentElement.classList.add("theme-upleb");
        if (t === "mono") document.documentElement.classList.add("theme-mono");
      } catch (e) {
        document.documentElement.classList.add("theme-mono");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
