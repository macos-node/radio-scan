[package]
name = "ntune"
version = "0.1.1-beta.3"
description = "radio-scan L4 desktop UI — tuner / player / subscription surface (n-suite)"
authors = ["macos-node"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it doesn't conflict with the
# bin name on Windows (see rust-lang/cargo#8519). Mirrors nplay.
name = "ntune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` enables the cross-platform menubar/tray API (U6, behind `--tray`).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Copy stream/feed URLs to the OS clipboard + a native Save dialog for the
# JSON export of the station / podcast lists. Both are cross-platform Tauri
# plugins; the file itself is written by our own `export_file` command.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loopback stream proxy (src/proxy.rs) — lets the webview play http:// radio from
# a secure origin without mixed-content blocking. A raw TCP relay (no HTTP client
# lib): tokio for the sockets, percent-encoding to decode the ?url= param.
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
percent-encoding = "2"
# ICY now-playing (U3): decode metadata as UTF-8 → Windows-1251 (RU servers) →
# Latin-1, matching radioscan.py's decode ladder.
encoding_rs = "0.8"
# Podcast RSS (U4): fetch the feed document + parse RSS 2.0/Atom + podcast tags.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
feed-rs = "2"
# Nostr identity + station.v1 publishing (U2). Same pins as ntree/ndisc.
nostr = "0.43"
nostr-sdk = "0.43"
# OS keychain for the owner nsec — dependency is PLATFORM-SPLIT in the
# [target.*] sections below (macOS Keychain vs Linux secret-service). A single
# global `sync-secret-service` build stores via D-Bus on macOS too, which fails
# on any Mac without a running secret-service — verified broken 2026-08-04.

# --- reserved for later phases -----------------------------------------------
# U3 loopback ICY proxy (port of radioscan.py) — nplay's loopback crate:
#   tiny_http = "0.12"
# U4 podcast RSS:
#   feed-rs = "2"

# --- OS keychain backend, per platform --------------------------------------
# macOS/iOS → native Keychain (apple-native); Linux → libsecret/secret-service
# (needs a pure-Rust crypto backend). Windows would use `windows-native`.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
