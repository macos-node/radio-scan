name: ntune Release

# Fires on any pushed tag starting with `ntune-v` (e.g. ntune-v0.1.0,
# ntune-v0.2.0-beta) and can also be run manually from the Actions tab.
# Produces a GitHub Release with ntune's native installers:
#   Linux x86_64 : .deb   (webkit2gtk; .AppImage deferred — freezes on playback,
#                          see gui/tauri/docs/appimage-gstreamer-2026-08-04.md)
#   macOS arm64  : .dmg   (WKWebView)
# The Linux job creates the release + notes; the macOS job appends its .dmg.
#
# ntune lives in gui/tauri/ within this monorepo — hence the per-job
# working-directory and the gui/tauri-prefixed artifact paths. The tag is
# namespaced (`ntune-v*`, not bare `v*`) so ntune releases don't collide with
# any future radio-scan core or RadioBar release in the same repo.

on:
  push:
    tags:
      - "ntune-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. ntune-v0.1.0-beta)"
        required: true

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: gui/tauri
    steps:
      - uses: actions/checkout@v6

      # Same Tauri system deps as the sibling apps (ndisc). libsecret-1-dev is
      # for the keyring crate (nsec signing, U2+). NOTE: AAC/AAC+ playback in
      # webkit2gtk needs gstreamer1.0-plugins-bad + gstreamer1.0-libav on the
      # END USER's machine — that's a runtime/packaging concern, not a build
      # dep; see gui/tauri/CONTRIBUTING-cross-session.md §6.
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/tauri/src-tauri

      - name: Install npm deps
        run: npm ci

      # .deb ONLY for now: the AppImage's bundled GStreamer is missing
      # appsink/autoaudiosink, so it freezes on playback (see
      # gui/tauri/docs/appimage-gstreamer-2026-08-04.md). The .deb is
      # system-linked and Depends on the gst codec plugins, so it has sound.
      # Re-add `appimage` here once the bundle ships the audio-sink plugins.
      - name: Build Tauri bundle (.deb)
        run: npm run tauri build -- --bundles deb

      - name: Determine tag + prerelease
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Pre-release if the VERSION part (after `ntune-v`) has a hyphen, e.g.
          # ntune-v0.1.0-beta. Checking the whole tag would always match (the
          # `ntune-` prefix itself contains a hyphen).
          VER="${TAG#ntune-v}"
          case "$VER" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          files: |
            gui/tauri/src-tauri/target/release/bundle/deb/*.deb

  build-macos-arm64:
    name: Build macOS arm64
    # Runs after the Linux job so the release (and its notes) already exist;
    # this job only appends the .dmg to it.
    needs: build-linux-x86_64
    runs-on: macos-14
    defaults:
      run:
        working-directory: gui/tauri
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/tauri/src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri bundle (.dmg)
        run: npm run tauri build -- --bundles dmg

      - name: Determine tag + prerelease
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VER="${TAG#ntune-v}"
          case "$VER" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Appends the .dmg to the release the Linux job already published — no
      # `name`/`generate_release_notes` here, so the two jobs don't clobber.
      - name: Upload macOS installer to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          files: |
            gui/tauri/src-tauri/target/release/bundle/dmg/*.dmg
