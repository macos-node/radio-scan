name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Python core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile
        run: |
          python -m py_compile radioscan.py
          find enrich -name '*.py' -print0 | xargs -0 -r python -m py_compile

  macos-gui:
    name: RadioBar (macOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: gui/macos
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
